name: Build Bondly Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to produce'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses & Pre-seed Hashes
        run: |
          echo "Non-interactively configuring and accepting all Android SDK licenses..."
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_HOME/licenses"

          # Pre-seed verified license hashes so AGP and sdkmanager never prompt or stop
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n893fb8a22d82e324940bc61e56e60ac2ec82e5e9" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n27244462c7977d611b64e62a3000850f22473cb1\n793f25e32e60f54121a65dc82c52ac238ff990e1" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "33b6a2b64f07f11b283f4566e68c51638ce497a9" > "$ANDROID_HOME/licenses/google-gdk-license"
          printf "e9acab587f1749c4f81757fb6388acaa04d8b234" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          printf "601085b94cd77f0b54ff8640695709915000853d" > "$ANDROID_HOME/licenses/android-googletv-license"

          # Fallback acceptance via sdkmanager command-line
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          fi

      - name: Install Required Android SDK Packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager 2>/dev/null || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            echo "Installing platforms;android-36 and build-tools;36.0.0..."
            yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "GOOGLE_SERVICES_JSON secret found. Checking format..."
            FIRST_CHAR=$(echo "$GOOGLE_SERVICES_JSON_SECRET" | tr -d '[:space:]' | head -c 1)
            if [ "$FIRST_CHAR" = "{" ] || [ "$FIRST_CHAR" = "[" ]; then
              echo "Detected raw JSON format. Writing to app/google-services.json..."
              printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            else
              echo "Detected encoded format. Attempting Base64 decoding..."
              if echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > app/google-services.json 2>/dev/null; then
                echo "Successfully decoded Base64 content to app/google-services.json."
              else
                echo "Base64 decode failed. Writing secret as raw text..."
                printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
              fi
            fi
          elif [ -f "app/google-services.json" ]; then
            echo "Using committed app/google-services.json file from repository."
          else
            echo "::error::Missing app/google-services.json and GOOGLE_SERVICES_JSON secret is not set!"
            echo "Please configure the repository secret 'GOOGLE_SERVICES_JSON' under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Validate Firebase Configuration
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json does not exist!"
            exit 1
          fi

          python3 -c '
          import json, sys

          try:
              with open("app/google-services.json", "r") as f:
                  data = json.load(f)
          except Exception as e:
              print("::error::app/google-services.json is not valid JSON! Error: " + str(e))
              sys.exit(1)

          project_id = data.get("project_info", {}).get("project_id", "")
          print("Validated Firebase project_id: " + project_id)
          if project_id != "dating-buddy-b3581":
              print(f"::warning::Expected Firebase project dating-buddy-b3581, found: {project_id}")

          expected_pkg = "com.dating.bondly.app"
          client_list = data.get("client", [])
          pkg_names = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
              for c in client_list
          ]
          print("Found registered client packages: " + ", ".join(pkg_names))
          if expected_pkg not in pkg_names:
              print(f"::error::Firebase configuration does not match required applicationId: {expected_pkg}")
              sys.exit(1)

          print("Firebase configuration successfully validated!")
          '

      - name: Restore Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64_SECRET" ]; then
            echo "Decoding release keystore from RELEASE_KEYSTORE_BASE64 secret..."
            echo "$RELEASE_KEYSTORE_BASE64_SECRET" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Found existing debug.keystore."
          else
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "::error::gradlew script not found in root directory!"
            exit 1
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Generation
        run: |
          echo "### Generated APK Files" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Path | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            size=$(du -h "$apk" | cut -f1)
            name=$(basename "$apk")
            echo "| $name | \`$apk\` | $size |" >> $GITHUB_STEP_SUMMARY
            echo "Found APK: $apk ($size)"
          done

      - name: Upload Debug APK
        if: ${{ success() && (github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: Bondly-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        if: ${{ success() && (github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: Bondly-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
